# Indicator registry: the one place where scoring weights, categories and the
# short labels shown in the desktop app are defined. detectors/scoring.py reads
# the weights from here; gui.py reads the labels; tools/calibrate_weights.py
# writes proposals in the same format (see `weights_override` in the config).
#
# Change a weight here, run the test suite and the regression corpus, and bump
# `version` - reports record which registry version scored a file.

version: "2026.10.21-1"

caps:            # each category's total is capped, then the total is clamped to max_raw
  technical: 100.0
  reputation: 80.0
  semantic: 24.0      # deliberately below the top of Medium (49)
  statistical: 20.0
  dynamic: 100.0      # behaviour observed in a sandbox
max_raw: 100.0
semantic_only_max: 49   # semantic / statistical evidence alone never reaches High

weights:         # points when an indicator fires fully
  W_LOCAL_DB: 100.0   # exact known-bad hash => maximum
  W_YARA:
    critical: 90.0
    high: 65.0
    medium: 40.0
    low: 18.0
  W_YARA_EXTRA: 8.0   # each additional rule beyond the top one
  W_FUZZY: 72.0   # scaled by structural similarity confidence
  W_MACRO_AUTOEXEC: 22.0   # an auto-run trigger exists
  W_MACRO_CRITICAL: 40.0   # first exec/download primitive (Shell, etc.)
  W_MACRO_CRITICAL_EXTRA: 8.0   # each additional critical primitive
  W_MACRO_SUSPICIOUS: 10.0   # non-critical suspicious call(s), flat
  W_MACRO_DROPPER_SYNERGY: 20.0   # autoexec AND critical => classic dropper
  W_VT_RATIO: 80.0   # scaled by detection ratio
  W_VT_FLOOR: 35.0   # a few engines flag even at a low ratio
  W_LLM: 24.0   # scaled by confidence (semantic, capped low)
  W_VBA_STOMPING: 90.0   # P-code/source mismatch = deliberate evasion
  W_XLM_MACROS: 55.0   # Excel 4.0 macro sheets (rarely legitimate)
  W_DISGUISED_EXECUTABLE: 90.0   # PE/ELF/Mach-O/LNK/script behind a doc extension
  W_ENCRYPTED_CONTENT: 70.0   # signature gone + random bytes = ransomware impact
  W_FORMAT_MISMATCH: 15.0   # content doesn't match the extension
  W_INJECTION_CONFIRMED: 50.0   # prompt injection hidden in the document
  W_INJECTION_SUSPICIOUS: 15.0   # injection phrasing in visible text only
  W_HIDDEN_CONTENT: 15.0   # concealed text (hidden runs, invisible PDF text)
  W_RTI:   # Office external relationships
    exploit_scheme: 90.0
    follina_style_ole: 90.0
    remote_template: 70.0
    external_ole: 70.0
    unc_ntlm_leak: 70.0
    rtf_remote_template: 70.0
    external_frame: 40.0
    external_subdocument: 40.0
    rtf_ole_autoupdate: 40.0
  W_RTI_EXTRA: 8.0   # each additional distinct relationship kind
  W_ARCHIVE_SLIP: 80.0   # path traversal / symlink entries
  W_ARCHIVE_BOMB: 60.0   # decompression bomb
  W_ARCHIVE_DOUBLE_EXT: 60.0   # invoice.pdf.exe
  W_ARCHIVE_RTLO: 60.0   # right-to-left-override filename spoof
  W_ARCHIVE_EXECUTABLE: 35.0   # executable/script/shortcut inside an archive
  W_ARCHIVE_ENCRYPTED: 20.0   # encrypted content the scanner could not open
  W_MAIL_DMARC_FAIL: 35.0   # receiving server says the From domain is forged
  W_MAIL_AUTH_FAIL: 20.0   # SPF or DKIM failed (DMARC not failed / absent)
  W_MAIL_DISPLAY_SPOOF: 30.0   # "billing@bank.com" <x@evil.tld>
  W_MAIL_REPLY_TO: 15.0   # replies diverted to another organisation
  W_MAIL_DECEPTIVE_LINK: 25.0   # link text shows one domain, href goes to another
  W_MAIL_RISKY_ATTACHMENT: 45.0   # executable / script / macro-enabled attachment
  W_MAIL_DOUBLE_EXT: 60.0
  W_MAIL_RTLO: 60.0
  W_MAIL_LURE_SUBJECT: 8.0   # semantic: urgency/payment/credential phrasing
  W_MAIL_ARCHIVE_PASSWORD: 30.0   # encrypted archive + its password in the mail (gateway evasion)
  W_HTML_SMUGGLING: 70.0   # Blob download construct + embedded payload (T1027.006)
  W_WEB_PAYLOAD: 60.0   # executable / archive / disc image embedded in a page
  W_WEB_DOWNLOAD_CONSTRUCT: 15.0   # the construct alone (web apps use it for exports)
  W_SVG_ACTIVE: 40.0   # script / event handlers / foreignObject in an SVG
  W_WEB_CREDENTIAL: 35.0   # password captured and sent out (phishing page)
  W_WEB_REDIRECT: 20.0   # page forwards to an external URL
  W_JS_OBFUSCATION: 15.0   # two or more obfuscation markers
  W_IMAGE_APPENDED_PAYLOAD: 70.0   # executable / archive after the end of an image
  W_ELF_BEHAVIOUR:   # hostile-only strings in an ELF, by category
    ransom_note: 60.0
    miner: 45.0
    reverse_shell: 45.0
    download_exec: 35.0
    evasion: 25.0
    persistence: 20.0
  W_ELF_BEHAVIOUR_EXTRA: 8.0   # each additional category
  W_ELF_PACKED: 20.0   # UPX or near-random content with few sections
  W_ELF_NO_SECTIONS: 10.0   # runnable ELF with its section table removed
  W_QR_SUSPICIOUS_URL: 35.0   # QR code leads to an IP / shortener / punycode / lure URL
  W_QR_URL: 8.0   # semantic: a QR code carries a web link (quishing pattern)
  W_SCRIPT_BEHAVIOUR:   # script attachments (JS / VBS / HTA / PS1 / BAT), by category
    recovery: 70.0
    dropper: 65.0
    ransom_note: 60.0
    defence_evasion: 40.0
    persistence: 25.0
    download: 20.0
    execute: 20.0
  W_SCRIPT_BEHAVIOUR_EXTRA: 8.0   # each additional category
  W_SCRIPT_ENCODED: 30.0   # Script Encoder output (.vbe / .jse): hides the source
  W_SCRIPT_OBFUSCATION: 20.0   # two or more obfuscation markers
  W_ONENOTE_RISKY: 45.0   # OneNote page carrying a script / program / shortcut
  W_CHM_SHORTCUT: 60.0   # help page that runs a command (HTML Help ShortCut object)
  W_MSI_SCRIPT_ACTION: 40.0   # VBScript / JScript custom action in an installer
  W_XLL_ADDIN: 40.0   # Excel add-in DLL: code that runs when Excel opens it
  W_OFFICE_ENCRYPTED: 10.0   # password-protected document no password opened
  W_SANDBOX_RANSOMWARE: 80.0   # encryption / shadow-copy deletion / ransom note observed
  W_SANDBOX_SIGNATURE:   # per behaviour signature, by severity
    3: 25.0
    2: 12.0
    1: 4.0
  W_SANDBOX_SIGNATURES_MAX: 70.0
  W_ML: 20.0   # scaled by P(suspicious)

indicators:      # name -> category, the weight it uses, label in the app
  local_db_hit: {category: technical, weight: W_LOCAL_DB, label: "known malicious hash"}
  yara_match: {category: technical, label: "YARA rule match"}
  fuzzy_family_match: {category: technical, weight: W_FUZZY, label: "similar to a known family"}
  macro_autoexec: {category: technical, weight: W_MACRO_AUTOEXEC, label: "auto-run macro"}
  macro_exec_primitive: {category: technical, label: "exec / download macro"}
  macro_suspicious: {category: technical, weight: W_MACRO_SUSPICIOUS, label: "suspicious macro"}
  macro_dropper_synergy: {category: technical, weight: W_MACRO_DROPPER_SYNERGY, label: "macro dropper"}
  vba_stomping: {category: technical, weight: W_VBA_STOMPING, label: "VBA stomping"}
  xlm_macros: {category: technical, weight: W_XLM_MACROS, label: "Excel 4.0 macros"}
  ml_classifier: {category: statistical, weight: W_ML, label: "ML model"}
  sandbox_ransomware_behaviour: {category: dynamic, weight: W_SANDBOX_RANSOMWARE, label: "sandbox: ransomware behaviour"}
  sandbox_behaviour: {category: dynamic, label: "sandbox behaviour"}
  virustotal: {category: reputation, label: "VirusTotal engines"}
  llm_semantic: {category: semantic, weight: W_LLM, label: "LLM opinion"}
  allowlisted: {category: technical, label: "on the allowlist"}
  disguised_executable: {category: technical, weight: W_DISGUISED_EXECUTABLE, label: "program disguised as a document"}
  encrypted_content: {category: technical, weight: W_ENCRYPTED_CONTENT, label: "content looks encrypted"}
  format_mismatch: {category: technical, weight: W_FORMAT_MISMATCH, label: "wrong file format"}
  prompt_injection: {category: technical, weight: W_INJECTION_CONFIRMED, label: "hidden instructions to AI"}
  prompt_injection_phrasing: {category: technical, weight: W_INJECTION_SUSPICIOUS, label: "AI-steering text"}
  hidden_content: {category: technical, weight: W_HIDDEN_CONTENT, label: "hidden text"}
  image_appended_payload: {category: technical, weight: W_IMAGE_APPENDED_PAYLOAD, label: "payload after image"}
  external_relationship: {category: technical, label: "loads content from the internet"}
  archive_zip_slip: {category: technical, weight: W_ARCHIVE_SLIP, label: "path traversal in archive"}
  archive_zip_bomb: {category: technical, weight: W_ARCHIVE_BOMB, label: "decompression bomb"}
  archive_double_extension: {category: technical, weight: W_ARCHIVE_DOUBLE_EXT, label: "double extension"}
  archive_rtlo_spoof: {category: technical, weight: W_ARCHIVE_RTLO, label: "spoofed file name"}
  archive_executable: {category: technical, weight: W_ARCHIVE_EXECUTABLE, label: "program inside archive"}
  archive_encrypted: {category: technical, weight: W_ARCHIVE_ENCRYPTED, label: "locked archive"}
  mail_dmarc_fail: {category: technical, weight: W_MAIL_DMARC_FAIL, label: "sender fails DMARC"}
  mail_auth_fail: {category: technical, weight: W_MAIL_AUTH_FAIL, label: "sender fails SPF/DKIM"}
  mail_display_name_spoof: {category: technical, weight: W_MAIL_DISPLAY_SPOOF, label: "spoofed sender name"}
  mail_reply_to_mismatch: {category: technical, weight: W_MAIL_REPLY_TO, label: "replies diverted"}
  mail_deceptive_link: {category: technical, weight: W_MAIL_DECEPTIVE_LINK, label: "deceptive link"}
  mail_double_extension: {category: technical, weight: W_MAIL_DOUBLE_EXT, label: "double extension"}
  mail_rtlo_spoof: {category: technical, weight: W_MAIL_RTLO, label: "spoofed file name"}
  mail_risky_attachment: {category: technical, weight: W_MAIL_RISKY_ATTACHMENT, label: "risky attachment"}
  mail_lure_subject: {category: semantic, weight: W_MAIL_LURE_SUBJECT, label: "pressure in subject"}
  mail_archive_password_in_body: {category: technical, weight: W_MAIL_ARCHIVE_PASSWORD, label: "password in the mail"}
  elf_behaviour: {category: technical, label: "hostile Linux program"}
  elf_packed: {category: technical, weight: W_ELF_PACKED, label: "packed Linux program"}
  elf_no_section_table: {category: technical, weight: W_ELF_NO_SECTIONS, label: "stripped Linux program"}
  qr_code_suspicious_url: {category: technical, weight: W_QR_SUSPICIOUS_URL, label: "QR code to a risky link"}
  qr_code_url: {category: semantic, weight: W_QR_URL, label: "QR code with a link"}
  onenote_embedded_file: {category: technical, weight: W_ONENOTE_RISKY, label: "OneNote with runnable file"}
  chm_shortcut_command: {category: technical, weight: W_CHM_SHORTCUT, label: "help file runs a command"}
  msi_script_custom_action: {category: technical, weight: W_MSI_SCRIPT_ACTION, label: "installer script action"}
  xll_addin: {category: technical, weight: W_XLL_ADDIN, label: "Excel add-in code"}
  office_encrypted_unopened: {category: technical, weight: W_OFFICE_ENCRYPTED, label: "locked document"}
  script_behaviour: {category: technical, label: "script downloads / runs code"}
  script_encoded: {category: technical, weight: W_SCRIPT_ENCODED, label: "encoded script"}
  script_obfuscation: {category: technical, weight: W_SCRIPT_OBFUSCATION, label: "obfuscated script"}
  html_smuggling: {category: technical, weight: W_HTML_SMUGGLING, label: "HTML smuggling"}
  web_download_construct: {category: technical, weight: W_WEB_DOWNLOAD_CONSTRUCT, label: "page builds a download"}
  web_embedded_payload: {category: technical, weight: W_WEB_PAYLOAD, label: "file hidden in page"}
  svg_active_content: {category: technical, weight: W_SVG_ACTIVE, label: "active SVG"}
  web_credential_capture: {category: technical, weight: W_WEB_CREDENTIAL, label: "password form"}
  web_redirect: {category: technical, weight: W_WEB_REDIRECT, label: "redirects away"}
  js_obfuscation: {category: technical, weight: W_JS_OBFUSCATION, label: "obfuscated script"}
