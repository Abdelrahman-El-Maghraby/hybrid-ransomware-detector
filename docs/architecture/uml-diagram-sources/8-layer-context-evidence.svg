<g id="d8-node">
<rect x="44" y="150" width="380" height="102" fill="#eff6ff" rx="10" stroke="#0f172a" stroke-width="1.5"/>
<text x="234" y="172.9" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle">1 Identity</text>
<text x="234" y="189.7" font-size="12.5" fill="#0f172a" text-anchor="middle">hashes -&gt; md5, sha256</text>
<text x="234" y="206.2" font-size="12.5" fill="#0f172a" text-anchor="middle">allowlist -&gt; flag allowlisted</text>
<text x="234" y="222.7" font-size="12.5" fill="#0f172a" text-anchor="middle">fuzzy -&gt; FuzzySignal</text>
<text x="234" y="239.2" font-size="12.5" fill="#0f172a" text-anchor="middle">local-db -&gt; flag local_db_hit</text>
<rect x="44" y="266" width="380" height="69" fill="#eff6ff" rx="10" stroke="#0f172a" stroke-width="1.5"/>
<text x="234" y="288.9" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle">2 Structure</text>
<text x="234" y="305.7" font-size="12.5" fill="#0f172a" text-anchor="middle">macro, yara, integrity,</text>
<text x="234" y="322.2" font-size="12.5" fill="#0f172a" text-anchor="middle">elf, pe, script -&gt; one signal each</text>
<rect x="44" y="349" width="380" height="69" fill="#eff6ff" rx="10" stroke="#0f172a" stroke-width="1.5"/>
<text x="234" y="371.9" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle">3 Mail container</text>
<text x="234" y="388.7" font-size="12.5" fill="#0f172a" text-anchor="middle">mail: opens the message, scans each</text>
<text x="234" y="405.2" font-size="12.5" fill="#0f172a" text-anchor="middle">attachment, keeps the body as text</text>
<rect x="44" y="432" width="380" height="69" fill="#eff6ff" rx="10" stroke="#0f172a" stroke-width="1.5"/>
<text x="234" y="454.9" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle">4 Content</text>
<text x="234" y="471.7" font-size="12.5" fill="#0f172a" text-anchor="middle">prompt-guard: extracts text + strings once</text>
<text x="234" y="488.2" font-size="12.5" fill="#0f172a" text-anchor="middle">relationships, qr</text>
<rect x="44" y="515" width="380" height="69" fill="#eff6ff" rx="10" stroke="#0f172a" stroke-width="1.5"/>
<text x="234" y="537.9" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle">5 Containers</text>
<text x="234" y="554.7" font-size="12.5" fill="#0f172a" text-anchor="middle">archive, web, embedded: members go back</text>
<text x="234" y="571.2" font-size="12.5" fill="#0f172a" text-anchor="middle">through scan_file at depth + 1</text>
<rect x="44" y="608" width="380" height="102" fill="#fef3c7" rx="10" stroke="#0f172a" stroke-width="1.5"/>
<text x="234" y="630.9" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle">6 Heavy layers (heavy = True)</text>
<text x="234" y="647.7" font-size="12.5" fill="#0f172a" text-anchor="middle">emulation, ml, llm, virustotal: skipped when allowlisted</text>
<text x="234" y="664.2" font-size="12.5" fill="#0f172a" text-anchor="middle">or already 100/100; else concurrently, each on a copy</text>
<text x="234" y="680.7" font-size="12.5" fill="#0f172a" text-anchor="middle">of the context, merged back in pipeline order</text>
<text x="234" y="697.2" font-size="12.5" fill="#0f172a" text-anchor="middle">sandbox: last (alone in a worker), gate risk &gt;= 25</text>
<rect x="560" y="150" width="400" height="180" fill="#ffffff" rx="3" stroke="#0f172a" stroke-width="1.6"/>
<rect x="560" y="150" width="400" height="30" fill="#dcfce7" rx="3" stroke="#0f172a" stroke-width="1.6"/>
<rect x="560.8" y="174" width="398.4" height="6" fill="#dcfce7" stroke="none"/>
<line x1="560" y1="180" x2="960" y2="180" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="760" y="170" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">ScanContext</text>
<text x="570" y="198" font-size="12.5" fill="#0f172a">path, display (&quot;mail.eml!/a.zip!/x.js&quot;)</text>
<text x="570" y="215.5" font-size="12.5" fill="#0f172a">depth (0 top level, +1 per container)</text>
<text x="570" y="233" font-size="12.5" fill="#0f172a">is_archive, is_mail, is_web, embedded_kind</text>
<text x="570" y="250.5" font-size="12.5" fill="#0f172a">data(): whole file once, up to 64 MiB</text>
<text x="570" y="268" font-size="12.5" fill="#0f172a">hashes, text, strings</text>
<text x="570" y="285.5" font-size="12.5" fill="#0f172a">signals: Signals</text>
<text x="570" y="303" font-size="12.5" fill="#0f172a">result[&quot;scan_results&quot;]: report entries</text>
<text x="570" y="320.5" font-size="12.5" fill="#0f172a">layer_log, member_reasons, member_shared</text>
<rect x="560" y="390" width="400" height="110" fill="#ffffff" rx="3" stroke="#0f172a" stroke-width="1.6"/>
<rect x="560" y="390" width="400" height="30" fill="#dcfce7" rx="3" stroke="#0f172a" stroke-width="1.6"/>
<rect x="560.8" y="414" width="398.4" height="6" fill="#dcfce7" stroke="none"/>
<line x1="560" y1="420" x2="960" y2="420" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"/>
<text x="760" y="410" font-size="14" fill="#0f172a" font-weight="700" text-anchor="middle">Signals</text>
<text x="570" y="438" font-size="12.5" fill="#0f172a">19 typed signals (FuzzySignal ... EmulationSignal)</text>
<text x="570" y="455.5" font-size="12.5" fill="#0f172a">flags: allowlisted, local_db_hit, scan_failed</text>
<text x="570" y="473" font-size="12.5" fill="#0f172a">container signals carry .worst (WorstMember)</text>
<text x="570" y="490.5" font-size="12.5" fill="#0f172a">extra: signals of third-party layers</text>
<polygon points="560,530 948,530 960,542 960,675 560,675" fill="#fffbeb" stroke="#92400e" stroke-width="1.2" stroke-linejoin="round"/>
<polyline points="948,530 948,542 960,542" fill="none" stroke="#92400e" stroke-width="1.2"/>
<text x="569" y="549.6" font-size="12" fill="#0f172a">Each layer does two things: its full result goes to scan_results[key]</text>
<text x="569" y="565.7" font-size="12" fill="#0f172a">(what reports show) and its typed signal to ctx.signals (what scoring</text>
<text x="569" y="581.7" font-size="12" fill="#0f172a">reads).</text>
<text x="569" y="597.8" font-size="12" fill="#0f172a">A layer that raises is recorded in layer_errors and in layer_log; the</text>
<text x="569" y="613.9" font-size="12" fill="#0f172a">scan goes on.</text>
<text x="569" y="630" font-size="12" fill="#0f172a">Order rules (ORDER_RULES): hashes before allowlist, local-db, llm,</text>
<text x="569" y="646.1" font-size="12" fill="#0f172a">virustotal, sandbox; mail before prompt-guard; prompt-guard before</text>
<text x="569" y="662.1" font-size="12" fill="#0f172a">llm; sandbox last.</text>
<rect x="1060" y="160" width="496" height="86" fill="#f5f3ff" rx="10" stroke="#0f172a" stroke-width="1.5"/>
<text x="1308" y="183.1" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle">ScoringMatrix.score(signals)</text>
<text x="1308" y="199.9" font-size="12.5" fill="#0f172a" text-anchor="middle">23 scorer functions turn signals into Contribution(indicator, category, points, detail);</text>
<text x="1308" y="216.4" font-size="12.5" fill="#0f172a" text-anchor="middle">per-category caps; total clamped to 100; semantic or statistical evidence alone stays</text>
<text x="1308" y="232.9" font-size="12.5" fill="#0f172a" text-anchor="middle">&lt;= 49; allowlist sets 0 unless the hash is in the malware database.</text>
<rect x="1060" y="286" width="496" height="69" fill="#f5f3ff" rx="10" stroke="#0f172a" stroke-width="1.5"/>
<text x="1308" y="308.9" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle">ScoreResult</text>
<text x="1308" y="325.7" font-size="12.5" fill="#0f172a" text-anchor="middle">risk_score 0-100, verdict band, severity_score (legacy 0-10), is_malicious,</text>
<text x="1308" y="342.2" font-size="12.5" fill="#0f172a" text-anchor="middle">contributions, category_totals, registry_version</text>
<rect x="1060" y="395" width="496" height="86" fill="#f5f3ff" rx="10" stroke="#0f172a" stroke-width="1.5"/>
<text x="1308" y="418.1" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle">assess(scanner, ctx)</text>
<text x="1308" y="434.9" font-size="12.5" fill="#0f172a" text-anchor="middle">Reads scan_results, layer states and member reasons: scan_status (complete,</text>
<text x="1308" y="451.4" font-size="12.5" fill="#0f172a" text-anchor="middle">unsupported, partial, locked, failed) and up to 100 incomplete_reasons. Independent</text>
<text x="1308" y="467.9" font-size="12.5" fill="#0f172a" text-anchor="middle">of the score.</text>
<rect x="1060" y="521" width="496" height="69" fill="#f5f3ff" rx="10" stroke="#0f172a" stroke-width="1.5"/>
<text x="1308" y="543.9" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle">file_provenance(scanner, ctx)</text>
<text x="1308" y="560.7" font-size="12.5" fill="#0f172a" text-anchor="middle">layers run, not applicable, unavailable, failed, skipped; external services configured;</text>
<text x="1308" y="577.2" font-size="12.5" fill="#0f172a" text-anchor="middle">what was sent outside (shared); isolation</text>
<rect x="1060" y="630" width="496" height="69" fill="#e2e8f0" rx="10" stroke="#0f172a" stroke-width="1.5"/>
<text x="1308" y="652.9" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle">The result (api/scan_result.schema.json)</text>
<text x="1308" y="669.7" font-size="12.5" fill="#0f172a" text-anchor="middle">verdict, risk_score, score_breakdown, scan_status, incomplete_reasons,</text>
<text x="1308" y="686.2" font-size="12.5" fill="#0f172a" text-anchor="middle">verdict_label (&quot;Clean (partial scan)&quot;), provenance, scan_results</text>
</g>
<g id="d8-label">
<rect x="445.8" y="688.1" width="108.4" height="33.7" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="500" y="701.6" font-size="12" fill="#334155" text-anchor="middle">each layer writes</text>
<text x="500" y="717" font-size="12" fill="#334155" text-anchor="middle">an entry + a signal</text>
<rect x="987" y="314.8" width="46.1" height="18.4" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="1010" y="328.3" font-size="12" fill="#0f172a" text-anchor="middle">signals</text>
</g>
<g id="d8-front">
<text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">Layers, the shared context, and how evidence becomes a result</text>
<text x="24" y="63" font-size="13" fill="#334155">engine/layers.py, engine/staging.py, detectors/scoring.py. Code at commit d45715a.</text>
</g>
</svg>
