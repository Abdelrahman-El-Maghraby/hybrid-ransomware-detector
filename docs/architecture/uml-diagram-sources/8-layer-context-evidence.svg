<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="d8" width="1600" height="770" viewBox="0 0 1600 770" role="img" aria-labelledby="d8-title d8-desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="d8-title">Layers, the shared context, and how evidence becomes a result</title>
<desc id="d8-desc">Data-flow diagram: the coordinator runs each layer on one ScanContext; layers add report entries and typed signals; heavy layers run on copies that are merged back; _assemble scores the signals and assesses completeness.</desc>
<rect x="0" y="0" width="1600" height="770" fill="#ffffff"/>
<g id="d8-frame">
<rect x="24" y="92" width="420" height="656" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.4"/>
<text x="36" y="112" font-size="13" fill="#0f172a" font-weight="700">scan_file(): the coordinator</text>
<text x="36" y="128.9" font-size="12" fill="#334155">runs the 22 layers in order</text>
<rect x="1040" y="92" width="536" height="656" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.4"/>
<text x="1052" y="112" font-size="13" fill="#0f172a" font-weight="700">_assemble(ctx): once, at the end</text>
<text x="1052" y="128.9" font-size="12" fill="#334155">no logging, no side effects</text>
</g>
