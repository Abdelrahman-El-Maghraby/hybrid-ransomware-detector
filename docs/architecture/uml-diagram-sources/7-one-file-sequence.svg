<text x="320" y="183.3" font-size="12" fill="#0f172a" text-anchor="middle">scan_isolated(targets, ...)</text>
<rect x="569" y="213.8" width="142" height="18.4" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="640" y="227.3" font-size="12" fill="#0f172a" text-anchor="middle">start a spawned Process</text>
<rect x="618.4" y="305.8" width="43.3" height="18.4" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="640" y="319.3" font-size="12" fill="#0f172a" text-anchor="middle">&#x27;ready&#x27;</text>
<rect x="578.2" y="345.8" width="123.6" height="18.4" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="640" y="359.3" font-size="12" fill="#0f172a" text-anchor="middle">file path (clock starts)</text>
<rect x="915.9" y="385.8" width="88.3" height="18.4" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="960" y="399.3" font-size="12" fill="#0f172a" text-anchor="middle">scan_file(path)</text>
<rect x="580.3" y="475.8" width="119.4" height="18.4" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="640" y="489.3" font-size="12" fill="#0f172a" text-anchor="middle">&#x27;container&#x27;, &#x27;member&#x27;</text>
<rect x="1222.9" y="475.8" width="114.1" height="18.4" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="1280" y="489.3" font-size="12" fill="#0f172a" text-anchor="middle">hash or text (opt-in)</text>
<rect x="576.9" y="515.8" width="126.2" height="18.4" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="640" y="529.3" font-size="12" fill="#0f172a" text-anchor="middle">&#x27;external&#x27;, &#x27;provisional&#x27;</text>
<rect x="1256.3" y="515.8" width="47.4" height="18.4" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="1280" y="529.3" font-size="12" fill="#0f172a" text-anchor="middle">answer</text>
<rect x="579.3" y="653.8" width="121.4" height="18.4" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="640" y="667.3" font-size="12" fill="#0f172a" text-anchor="middle">&#x27;completed&#x27;, &#x27;log&#x27;, &#x27;ok&#x27;</text>
<rect x="266" y="749.8" width="108" height="18.4" rx="3" fill="#ffffff" fill-opacity="0.94" stroke="none"/>
<text x="320" y="763.3" font-size="12" fill="#0f172a" text-anchor="middle">on_result: collect()</text>
</g>
<g id="d7-front">
<text x="24" y="40" font-size="22" fill="#0f172a" font-weight="700">One file across processes: an isolated scan, step by step</text>
<text x="24" y="63" font-size="13" fill="#334155">Isolated scan (the default). Branch review/production-hardening, code at commit d45715a.</text>
</g>
</svg>
