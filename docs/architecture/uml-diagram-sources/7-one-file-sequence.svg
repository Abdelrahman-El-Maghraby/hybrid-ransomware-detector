<g id="d7-node">
<rect x="30" y="104" width="260" height="52" fill="#1e293b" rx="4" stroke="#1e293b" stroke-width="1.5"/>
<text x="160" y="127.1" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Entry point</text>
<text x="160" y="143.6" font-size="12" fill="#e2e8f0" text-anchor="middle">GUI, CLI, API, monitor, IMAP</text>
<rect x="350" y="104" width="260" height="52" fill="#1e293b" rx="4" stroke="#1e293b" stroke-width="1.5"/>
<text x="480" y="127.1" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Parent: _IsolatedScan</text>
<text x="480" y="143.6" font-size="12" fill="#e2e8f0" text-anchor="middle">engine/workers.py</text>
<rect x="670" y="104" width="260" height="52" fill="#1e293b" rx="4" stroke="#1e293b" stroke-width="1.5"/>
<text x="800" y="127.1" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Worker process</text>
<text x="800" y="143.6" font-size="12" fill="#e2e8f0" text-anchor="middle">_worker_main, _serve</text>
<rect x="990" y="104" width="260" height="52" fill="#1e293b" rx="4" stroke="#1e293b" stroke-width="1.5"/>
<text x="1120" y="127.1" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Pipeline in the worker</text>
<text x="1120" y="143.6" font-size="12" fill="#e2e8f0" text-anchor="middle">scan_file, layers, _assemble</text>
<rect x="1310" y="104" width="260" height="52" fill="#1e293b" rx="4" stroke="#1e293b" stroke-width="1.5"/>
<text x="1440" y="127.1" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Services (optional)</text>
<text x="1440" y="143.6" font-size="12" fill="#e2e8f0" text-anchor="middle">VirusTotal, LLM, CAPE</text>
<rect x="650" y="254" width="300" height="40" fill="#f0fdf4" rx="4" stroke="#0f172a" stroke-width="1.5"/>
<text x="800" y="270.4" font-size="12" fill="#0f172a" text-anchor="middle">memory limit, own process group,</text>
<text x="800" y="286.2" font-size="12" fill="#0f172a" text-anchor="middle">own temp folder; build the scanner</text>
<rect x="975" y="428" width="290" height="40" fill="#f0fdf4" rx="4" stroke="#0f172a" stroke-width="1.5"/>
<text x="1120" y="444.4" font-size="12" fill="#0f172a" text-anchor="middle">fast layers in order; containers send</text>
<text x="1120" y="460.2" font-size="12" fill="#0f172a" text-anchor="middle">members back through scan_file</text>
<rect x="975" y="558" width="290" height="40" fill="#f0fdf4" rx="4" stroke="#0f172a" stroke-width="1.5"/>
<text x="1120" y="574.4" font-size="12" fill="#0f172a" text-anchor="middle">heavy layers on context copies;</text>
<text x="1120" y="590.2" font-size="12" fill="#0f172a" text-anchor="middle">sandbox last, alone, in a worker</text>
<rect x="975" y="608" width="290" height="40" fill="#f0fdf4" rx="4" stroke="#0f172a" stroke-width="1.5"/>
<text x="1120" y="624.4" font-size="12" fill="#0f172a" text-anchor="middle">_assemble: score, scan_status,</text>
<text x="1120" y="640.2" font-size="12" fill="#0f172a" text-anchor="middle">provenance</text>
<rect x="330" y="689" width="300" height="58" fill="#eff6ff" rx="4" stroke="#0f172a" stroke-width="1.5"/>
<text x="480" y="706.5" font-size="12" fill="#0f172a" text-anchor="middle">read_reply: at most 16 MiB of JSON;</text>
<text x="480" y="722.3" font-size="12" fill="#0f172a" text-anchor="middle">check_reply: shape and types;</text>
<text x="480" y="738.2" font-size="12" fill="#0f172a" text-anchor="middle">the result must name this file</text>
<rect x="35" y="796" width="250" height="40" fill="#eff6ff" rx="4" stroke="#0f172a" stroke-width="1.5"/>
<text x="160" y="812.4" font-size="12" fill="#0f172a" text-anchor="middle">auto-quarantine (batch scans</text>
<text x="160" y="828.2" font-size="12" fill="#0f172a" text-anchor="middle">only), then report and deliver</text>
<polygon points="1060,852 1548,852 1560,864 1560,965 1060,965" fill="#fffbeb" stroke="#92400e" stroke-width="1.2" stroke-linejoin="round"/>
<polyline points="1548,852 1548,864 1560,864" fill="none" stroke="#92400e" stroke-width="1.2"/>
<text x="1069" y="871.6" font-size="12" fill="#0f172a">Parent to worker: the path, then None to stop.</text>
<text x="1069" y="887.7" font-size="12" fill="#0f172a">Worker to parent: one JSON message each; kinds ready, log, ok, error, container,</text>
<text x="1069" y="903.7" font-size="12" fill="#0f172a">member, provisional, settled, sandbox, external, completed, clear.</text>
<text x="1069" y="919.8" font-size="12" fill="#0f172a">Three failed starts: no file is parsed in the parent; each gets an isolation_unavailable</text>
<text x="1069" y="935.9" font-size="12" fill="#0f172a">result (scan_status failed).</text>
<text x="1069" y="952" font-size="12" fill="#0f172a">ISOLATE_SCANS=0 (development only): the parent calls scan_file itself.</text>
</g>
