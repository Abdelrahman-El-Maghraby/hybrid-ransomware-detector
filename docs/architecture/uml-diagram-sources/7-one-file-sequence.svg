<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="d7" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="d7-title d7-desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="d7-title">One file across processes: an isolated scan, step by step</title>
<desc id="d7-desc">Sequence diagram: the entry point hands a file to the parent coordinator, which starts a worker process, sends the path, receives checked JSON messages while the pipeline runs, and hands the result back.</desc>
<rect x="0" y="0" width="1600" height="1010" fill="#ffffff"/>
<g id="d7-frame">
<rect x="300" y="856" width="700" height="112" fill="#ffffff" rx="4" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="300" y="856" width="52" height="22" fill="#fee2e2" rx="2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="326" y="871" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">alt</text>
<text x="364" y="872" font-size="12" fill="#0f172a" font-weight="700">[time limit, dead worker, invalid reply, memory limit]</text>
<text x="316" y="896" font-size="12" fill="#0f172a">settled or completed snapshot: kept as the result</text>
<text x="316" y="914" font-size="12" fill="#0f172a">provisional snapshot: stopped_result(), status partial, waiting layers named</text>
<text x="316" y="932" font-size="12" fill="#0f172a">no snapshot or a failure: failure_result(), status failed (scan_failed, Medium)</text>
<text x="316" y="950" font-size="12" fill="#0f172a">then: kill the worker and its helpers, delete its temp folder, start another</text>
</g>
