<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="d6" width="1600" height="1090" viewBox="0 0 1600 1090" role="img" aria-labelledby="d6-title d6-desc" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="d6-title">Kubernetes deployment: Pods, containers and what separates them</title>
<desc id="d6-desc">Kubernetes deployment and trust-boundary diagram of Aegis Sentinel: one Pod with the TLS proxy and the analysis service joined by a Unix socket, an isolation-gate init container, two single-Pod claims, a content Job, and the destinations the NetworkPolicy blocks.</desc>
<rect x="0" y="0" width="1600" height="1090" fill="#ffffff"/>
<g id="d6-frame">
<rect x="760" y="12" width="820" height="62" fill="#f8fafc" rx="6" stroke="#94a3b8" stroke-width="1"/>
<rect x="1280" y="22" width="40" height="16" fill="#eff6ff" rx="3" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="774" y="48" width="40" height="16" fill="#ffffff" rx="3" stroke="#7c3aed" stroke-width="2"/>
<rect x="1230" y="48" width="40" height="16" fill="#f0fdf4" rx="3" stroke="#b91c1c" stroke-width="3"/>
<rect x="20" y="90" width="1190" height="980" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.4"/>
<text x="32" y="110" font-size="13" fill="#0f172a" font-weight="700">Kubernetes cluster: namespace aegis-sentinel</text>
<text x="32" y="126.9" font-size="12" fill="#334155">Pod Security restricted. NetworkPolicy: default deny; ingress TCP 8443 to the analysis Pod only; no egress anywhere. Enforced only by a network plugin that implements it.</text>
<rect x="290" y="150" width="700" height="670" fill="#faf5ff" rx="8" stroke="#7c3aed" stroke-width="1.4"/>
<text x="302" y="170" font-size="13" fill="#0f172a" font-weight="700">Pod aegis-analysis: one replica, Recreate</text>
<text x="302" y="186.9" font-size="12" fill="#334155">No service-account token; fsGroup 10001; RuntimeDefault seccomp; grace period 330 s.</text>
<rect x="590" y="556" width="380" height="110" fill="#ffffff" rx="8" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="602" y="576" font-size="13" fill="#0f172a" font-weight="700">Workers, same uid 10001</text>
<rect x="1230" y="90" width="350" height="980" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.4"/>
<text x="1242" y="110" font-size="13" fill="#0f172a" font-weight="700">Outside the namespace</text>
<text x="1242" y="126.9" font-size="12" fill="#334155">What the analysis Pod must not reach.</text>
</g>
