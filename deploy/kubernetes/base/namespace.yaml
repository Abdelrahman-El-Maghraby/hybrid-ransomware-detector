# Pod Security Admission rejects any Pod in this namespace that does not meet the
# "restricted" standard (non-root, no privilege escalation, every capability
# dropped, a seccomp profile, no hostPath or host namespaces).
apiVersion: v1
kind: Namespace
metadata:
  name: aegis-sentinel
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
