name: dependency-audit

# I-3 (owner-approved 2026-11-12): the audit in quality.yml runs only on a push
# or a pull request, so an advisory published between runs went unnoticed (M21
# was found by hand eleven days after the last run). This runs the same audit
# every day and opens an issue when it fails (or comments on the open one).
# The locks are hash-pinned uv outputs, which Dependabot cannot regenerate, so
# updating a pin stays a deliberate `uv pip compile` (see the lock headers).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - name: Known vulnerabilities in the pinned dependencies
        run: |
          for lock in requirements.lock requirements-server.lock requirements-build.lock requirements-sbom.lock; do
            pip-audit --require-hashes -r "$lock" --progress-spinner off
          done

  report:
    needs: audit
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled dependency audit failed"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
                 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
              "pip-audit found a known vulnerability in a pinned dependency, or could not run. Run: $RUN_URL"
          fi
