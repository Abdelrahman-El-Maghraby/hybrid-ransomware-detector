name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements.txt
            requirements-ml.txt

      # unar reads every RAR method; Homebrew's 7-Zip is built without the RAR
      # codec, so compressed RAR members fail with it ("Unsupported Method").
      - name: RAR decompressor (macOS)
        if: runner.os == 'macOS'
        run: brew install unar || true

      - name: Install dependencies
        # The shipped set first (PR-06, PR-12): the hash-pinned lock, as the release
        # builds install it. On Python 3.12 (the release runtime) it must install
        # completely; Python 3.9 cannot install it (S-04, a recorded exception), so
        # the latest releases are tested there and the job says so. Every job then
        # adds the REST API and test extras so no API or fuzz test is skipped (PR-05).
        env:
          OS_PY: ${{ runner.os }} / Python ${{ matrix.python }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ "${{ matrix.python }}" = "3.9" ]; then
            deps="latest releases: requirements.lock does not install on Python 3.9 (S-04)"
            echo "::warning title=S-04 ($OS_PY)::requirements.lock does not install on Python 3.9; testing the latest releases instead"
            grep -vE '^\s*(#|$)' requirements.txt | sed 's/#.*//; s/[[:space:]]*$//' | while read -r pkg; do
              python -m pip install "$pkg" || echo "::warning::could not install $pkg on $OS_PY"
            done
            python -m pip install -r requirements-ml.txt || echo "::warning::ML extras not installed"
          else
            python -m pip install --require-hashes -r requirements.lock
            deps="requirements.lock (pinned with hashes, complete)"
          fi
          python -m pip install fastapi uvicorn python-multipart httpx hypothesis jsonschema qrcode
          echo "::notice title=Dependency set ($OS_PY)::$deps"
          echo "Dependency set: $deps"
          python -m pip freeze --all

      - name: Run the test suite
        env:
          LLM_PROVIDER: none
          PYTHONIOENCODING: utf-8
        # Each failing test is also reported as an annotation, so it shows on the
        # pull request without opening the log.
        # (bash runs with -e -o pipefail here: capture the status instead of exiting.)
        run: |
          status=0
          python -m pytest -q -rfs --tb=short 2>&1 | tee pytest.log || status=$?
          { grep -E '^(FAILED|ERROR) ' pytest.log || true; } | head -20 | while read -r line; do
            echo "::error title=${{ runner.os }} / Python ${{ matrix.python }}::$line"
          done
          exit $status

      - name: No API or fuzz test skipped for a missing package (PR-05)
        run: |
          if grep -E "^SKIPPED .*(fastapi|hypothesis|httpx|jsonschema)" pytest.log; then
            echo "::error title=${{ runner.os }} / Python ${{ matrix.python }}::tests were skipped because the API or test extras are missing"
            exit 1
          fi

      - name: Original v3 smoke test
        env:
          LLM_PROVIDER: none
          PYTHONIOENCODING: utf-8
        run: python test_smoke.py
