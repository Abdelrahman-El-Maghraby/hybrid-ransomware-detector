name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: RAR decompressor (macOS)
        if: runner.os == 'macOS'
        run: brew install sevenzip || true

      - name: Install dependencies
        # Every detection layer is optional and the suite skips what is missing,
        # so one package without a wheel for this OS / Python must not stop the run.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          grep -vE '^\s*(#|$)' requirements.txt | sed 's/#.*//; s/[[:space:]]*$//' | while read -r pkg; do
            python -m pip install "$pkg" || echo "::warning::could not install $pkg on ${{ runner.os }} / ${{ matrix.python }}"
          done
          python -m pip install -r requirements-ml.txt || echo "::warning::ML extras not installed"

      - name: Run the test suite
        env:
          LLM_PROVIDER: none
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -rs

      - name: Original v3 smoke test
        env:
          LLM_PROVIDER: none
          PYTHONIOENCODING: utf-8
        run: python test_smoke.py
