name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      # unar reads every RAR method; Homebrew's 7-Zip is built without the RAR
      # codec, so compressed RAR members fail with it ("Unsupported Method").
      - name: RAR decompressor (macOS)
        if: runner.os == 'macOS'
        run: brew install unar || true

      - name: Install dependencies
        # Every detection layer is optional and the suite skips what is missing,
        # so one package without a wheel for this OS / Python must not stop the run.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          grep -vE '^\s*(#|$)' requirements.txt | sed 's/#.*//; s/[[:space:]]*$//' | while read -r pkg; do
            python -m pip install "$pkg" || echo "::warning::could not install $pkg on ${{ runner.os }} / ${{ matrix.python }}"
          done
          python -m pip install -r requirements-ml.txt || echo "::warning::ML extras not installed"

      - name: Run the test suite
        env:
          LLM_PROVIDER: none
          PYTHONIOENCODING: utf-8
        # Each failing test is also reported as an annotation, so it shows on the
        # pull request without opening the log.
        # (bash runs with -e -o pipefail here: capture the status instead of exiting.)
        run: |
          status=0
          python -m pytest -q -rfs --tb=short 2>&1 | tee pytest.log || status=$?
          { grep -E '^(FAILED|ERROR) ' pytest.log || true; } | head -20 | while read -r line; do
            echo "::error title=${{ runner.os }} / Python ${{ matrix.python }}::$line"
          done
          exit $status

      - name: Original v3 smoke test
        env:
          LLM_PROVIDER: none
          PYTHONIOENCODING: utf-8
        run: python test_smoke.py
