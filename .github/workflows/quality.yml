name: quality

# Gates that run next to the test matrix (tests.yml): lint, types, coverage,
# known-vulnerable dependencies, and the regression corpus. Any failure blocks
# the pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff mypy bandit types-requests types-PyYAML
      - name: ruff (lint + import order + bug patterns + bandit-style checks)
        run: ruff check --output-format=github .
      - name: mypy (engine, core, detectors, API) against every optional package
        # With only the core packages, mypy treats the optional ones as Any and checks
        # less than ships (B2); the lock installs all of them.
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          mypy
      - name: bandit (security linter; medium and high findings fail the job)
        run: bandit -q -r engine detectors core api aegis_gui tools RansomwareScanner.py -ll

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: System packages (RAR, 7-Zip, zbar, Tk for the GUI test)
        timeout-minutes: 8               # a stuck apt mirror should fail fast, not eat the job
        run: sudo apt-get update && sudo apt-get install -y 7zip unar libzbar0 python3-tk xvfb
      - name: Install (pinned versions from the lock file)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install pytest pytest-cov hypothesis qrcode httpx jsonschema
      - name: Tests with coverage gate (fail under 85 %)
        env:
          LLM_PROVIDER: none
          RUN_GUI_TESTS: "1"
        # Failures and the coverage total are also reported as annotations, so they
        # show without opening the raw log.
        run: |
          set -o pipefail
          status=0
          xvfb-run -a python -m pytest -q -rfE --tb=short --cov --cov-report=term --cov-report=xml \
            --junitxml=junit.xml 2>&1 | tee pytest.log || status=$?
          { grep -E '^(FAILED|ERROR) |^TOTAL|Required test coverage|FAIL Required' pytest.log || true; } | head -20 | while read -r line; do
            echo "::error title=coverage job::$line"
          done
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
      # Every test case with its outcome, so "the GUI tests ran" can be checked
      # (pytest -q shows only failures).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: junit-coverage-job
          path: junit.xml

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - name: Known vulnerabilities in the pinned dependencies
        run: pip-audit -r requirements.lock --progress-spinner off

  regression-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock pytest
      - name: Verdicts, scores and indicators of the 13-file corpus are unchanged
        env:
          LLM_PROVIDER: none
        run: python -m pytest -q tests/test_regression_corpus.py tests/test_registry.py
