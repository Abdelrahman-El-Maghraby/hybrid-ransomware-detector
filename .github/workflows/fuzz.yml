name: parser-fuzz

# Long validation only when the harness changes; no sample downloads or secrets.
on:
  pull_request:
    paths: ['fuzz/**', '.github/workflows/fuzz.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atheris:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        group: [parsers, b4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install parser dependencies and fuzz tool
        run: |
          sudo apt-get update && sudo apt-get install -y 7zip unar libzbar0
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest hypothesis
          python -m pip install --require-hashes -r fuzz/requirements-linux.txt
      - name: Generate benign seeds and record environment
        env:
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-$GROUP/artifacts"
          python fuzz/seed_corpus.py "$GROUP" "$RUNNER_TEMP/fuzz-$GROUP/corpus"
          git rev-parse HEAD
          python --version
          python -m pip freeze
      - name: One hour of coverage-guided mutations
        env:
          GROUP: ${{ matrix.group }}
          LLM_PROVIDER: none
        run: |
          set -o pipefail
          python "fuzz/fuzz_$GROUP.py" -max_total_time=3600 -timeout=90 -rss_limit_mb=4096 \
            -max_len=1048576 -seed=20261030 -print_final_stats=1 \
            -artifact_prefix="$RUNNER_TEMP/fuzz-$GROUP/artifacts/" \
            "$RUNNER_TEMP/fuzz-$GROUP/corpus" 2>&1 | tee "$RUNNER_TEMP/fuzz-$GROUP/run.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: atheris-${{ matrix.group }}
          path: ${{ runner.temp }}/fuzz-${{ matrix.group }}
          retention-days: 14
